[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-data-engineer-retail-lakehouse"
version = "0.1.0"
description = "Portfolio project for a lead data engineer: metadata-driven retail sales lakehouse on Azure Databricks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sayak Chattopadhyay" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
